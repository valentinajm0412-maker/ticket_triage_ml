<!-- Create Ticket View || Vista de Creación de Ticket -->
{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: auto;">
    <h2>Crear Nuevo Ticket</h2>
    {% with messages = get_flashed_messages() %}{% for m in messages %}<p style="color: #c0392b;">{{ m }}</p>{% endfor %}{% endwith %}
    <form method="POST" action="{{ url_for('create_ticket') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom: 15px;">
            <label><strong>Título del caso:</strong></label>
            <input type="text" name="title" required style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label><strong>Tipo de caso:</strong></label>
            <select name="category" required style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">
                <option value="Incidente">Incidente (Soporte Técnico)</option>
                <option value="Requerimiento">Requerimiento (Soporte Funcional)</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label><strong>Descripción detallada:</strong></label>
            <textarea name="description" rows="5" required style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;" placeholder="Ej: Falla en proceso específico de facturación..."></textarea>
        </div>

        <button type="submit" style="background-color: #2c3e50; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer;">
            Enviar Caso
        </button>
    </form>
</div>
{% endblock %}
