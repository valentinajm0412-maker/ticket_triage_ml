<!-- Base Template for Minimalist UI || Plantilla Base para UI Minimalista -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ML Ticket Triage</title>
    <style>
        /* Global Styles || Estilos Globales */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        .navbar { background-color: #2c3e50; padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .navbar a:hover { color: #1abc9c; }
        .nav-right { display: flex; align-items: center; }
        .lang-switcher { display: inline-flex; align-items: center; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 5px; font-size: 0.88em; gap: 6px; margin-right: 15px; }
        .lang-opt { background: none; border: none; color: #bdc3c7; font-weight: bold; cursor: pointer; padding: 2px 5px; border-radius: 3px; font-family: inherit; font-size: 0.95em; }
        .lang-opt:hover { color: #fff; }
        .lang-opt.active { background: #1abc9c; color: #fff; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Navigation Bar || Barra de Navegación -->
    <div class="navbar">
        <div style="display: inline-flex; align-items: center; gap: 8px;">
            <!-- Smart Ticket SVG Icon || Icono SVG de Ticket Inteligente -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
                <path d="M11 4H4C2.89543 4 2 4.89543 2 6V9C3.10457 9 4 9.89543 4 11C4 12.1046 3.10457 13 2 13V18C2 19.1046 2.89543 20 4 20H13C14.1046 20 15 19.1046 15 18V13.8" stroke="#1abc9c" stroke-width="2" stroke-linecap="round"/>
                <path d="M7 8H10M7 12H9M7 16H11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                <!-- ML Nodes || Nodos de ML -->
                <circle cx="18" cy="8" r="2" fill="#1abc9c"/>
                <circle cx="15" cy="13" r="1.5" fill="#1abc9c"/>
                <circle cx="21" cy="13" r="1.5" fill="#1abc9c"/>
                <circle cx="18" cy="18" r="2" fill="#1abc9c"/>
                <line x1="18" y1="10" x2="18" y2="16" stroke="#1abc9c" stroke-width="1.5"/>
                <line x1="18" y1="8" x2="15" y2="13" stroke="#1abc9c" stroke-width="1"/>
                <line x1="18" y1="8" x2="21" y2="13" stroke="#1abc9c" stroke-width="1"/>
                <line x1="15" y1="13" x2="18" y2="18" stroke="#1abc9c" stroke-width="1"/>
                <line x1="21" y1="13" x2="18" y2="18" stroke="#1abc9c" stroke-width="1"/>
            </svg>
            <strong style="color: white;">Ticket Triage ML</strong>
        </div>
        <div class="nav-right">
            <!-- Language Selector || Selector de Idiomas -->
            <div class="lang-switcher" title="Select Language / Seleccionar Idioma">
                <span>🌐</span>
                <button type="button" class="lang-opt active" data-lang="en" onclick="setAppLanguage('en')">EN</button>
                <span style="color:#7f8c8d;">|</span>
                <button type="button" class="lang-opt" data-lang="es" onclick="setAppLanguage('es')">ES</button>
            </div>

            <span>{{ current_user.username }} ({{ current_user.role }})</span>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            {% if current_user.role == 'Admin' %}
                <a href="{{ url_for('admin_users') }}">Gestionar Usuarios</a>
            {% endif %}
            {% if current_user.role in ['Cliente', 'Admin'] %}
                <a href="{{ url_for('create_ticket') }}">Crear Ticket</a>
            {% endif %}
            <a href="{{ url_for('index') }}">Sitio del proyecto</a>
            <a href="{{ url_for('logout') }}">Salir</a>
        </div>
    </div>

    <!-- Main Content || Contenido Principal -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
</body>
</html>
